name: _Terraform Plan

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

env:
  AWS_REGION: us-east-2 # EDIT
  TF_VERSION: 1.14.3 # EDIT: match required_version in provider.tf

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit `shell: bash` turns on pipefail, so `terraform plan | tee` fails when plan fails.
        shell: bash
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Terraform Show
        if: steps.plan.outcome == 'success'
        run: terraform show -no-color tfplan

      - name: Comment plan summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_ENV: ${{ inputs.environment }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.PLAN_ENV;
            const marker = `<!-- tf-plan-${env} -->`;
            const icon = (o) => (o === 'success' ? '✅' : o === 'failure' ? '❌' : '⚠️');

            let summary = '⚠️ Plan did not run.';
            try {
              const out = fs.readFileSync(`environments/${env}/plan_output.txt`, 'utf8');
              const m = out.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy/);
              if (m) {
                summary = `**Plan: ${m[1]} to add, ${m[2]} to change, ${m[3]} to destroy**`;
              } else if (/No changes\./.test(out)) {
                summary = '**No changes.** Infrastructure matches the configuration.';
              } else if (process.env.PLAN_OUTCOME === 'failure') {
                summary = '❌ Plan failed. See the workflow logs.';
              }
            } catch (e) {
              summary = '⚠️ Plan did not run.';
            }

            const body = [
              marker,
              `### Terraform Plan — \`${env}\``,
              '',
              '| Step | Result |',
              '| --- | --- |',
              `| Format | ${icon(process.env.FMT_OUTCOME)} |`,
              `| Init | ${icon(process.env.INIT_OUTCOME)} |`,
              `| Validate | ${icon(process.env.VALIDATE_OUTCOME)} |`,
              `| Plan | ${icon(process.env.PLAN_OUTCOME)} |`,
              '',
              summary,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
